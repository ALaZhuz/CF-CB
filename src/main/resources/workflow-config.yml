# 工作流通知配置文件
#
# 四层优先级配置：
# 1. Tracker级差异配置（最高优先级）
# 2. tracker-matching tracker-id 匹配
# 3. tracker-matching tracker-type 匹配
# 4. 无匹配（不发送通知）

# ─────────────────────────────────────────────────────────────────────────────
# 钉钉通知模式配置
# ─────────────────────────────────────────────────────────────────────────────
dingtalk:
  mode: enterprise  # enterprise（企业钉钉）或 personal（个人钉钉Webhook）
  # 企业钉钉配置继承application.yml中的ding配置
  # 个人钉钉Webhook配置（如使用personal模式需配置）
  personal-webhook-url: ""

# ─────────────────────────────────────────────────────────────────────────────
# Tracker类型映射（决定消息中 {trackertype} 显示内容）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
type-mappings:
  global:
    Requirement: "需求"
    Bug: "缺陷"
    Task: "任务"
  projects:
    "5":
      Requirement: "智驾需求"
      Bug: "智驾缺陷"
    "1002":
      Requirement: "底盘需求"

# ─────────────────────────────────────────────────────────────────────────────
# 额外字段配置（动态插入到链接行之前）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
extra-fields:
  global:
    - field: "priority"
      label: "优先级"
    - field: "severity"
      label: "严重程度"
  projects:
    "5":


# ─────────────────────────────────────────────────────────────────────────────
# 全局工作流模板（无description字段）
# 项目级可直接引用或定义同名覆盖
# ─────────────────────────────────────────────────────────────────────────────
global-workflows:
  - name: "标准Bug工作流"
    states:
      - name: "新建"
        notify: false
      - name: "处理中"
        notify-field: "assignedTo"
      - name: "已解决"
        notify-field: "submitter"
      - name: "已关闭"
        notify: false

# ─────────────────────────────────────────────────────────────────────────────
# 项目级配置
# ─────────────────────────────────────────────────────────────────────────────
projects:
  - project-id: 5
    project-name: "智能驾驶项目A"

    # 项目级 type-mappings（覆盖全局，已在上方type-mappings.projects中配置）

    # 项目级 extra-fields（覆盖全局，已在上方extra-fields.projects中配置）

    # 项目独有 workflow（复用全局直接在tracker-matching引用）
    workflows:
      - name: "智驾需求流程"
        states:
          - name: "Accepted"
            notify: false
          - name: "评审中"
            notify-field: "assignedTo"
          - name: "Approved"
            notify-field: "assignedTo"
          - name: "已关闭"
            notify: false

    # tracker-matching：tracker-id + tracker-type（无tracker-name，防止名称重复）
    tracker-matching:
      - tracker-id: 5292
        workflow: "智驾需求流程"
      - tracker-id: 222
        workflow: "标准Bug工作流"
      - tracker-type: "Bug"
        workflow: "标准Bug工作流"
      - tracker-type: "Requirement"
        workflow: "智驾需求流程"

    # trackers：差异部分配置（tracker-matching未覆盖的特殊情况）
    trackers:
      - tracker-id: 333
        states:
          - name: "特殊状态A"
            notify-field: "特殊通知人"
          - name: "特殊状态B"
            notify: false

  - project-id: 1002
    project-name: "底盘项目B"

    # 无项目独有workflow，完全复用全局

    tracker-matching:
      - tracker-type: "Bug"
        workflow: "标准Bug工作流"
      - tracker-type: "Requirement"
        workflow: "标准需求工作流"