# 工作流通知配置文件
#
# 四层优先级配置：
# 1. Tracker级差异配置（最高优先级）
# 2. tracker-matching tracker-id 匹配
# 3. tracker-matching tracker-type 匹配
# 4. 无匹配（不发送通知）

# ─────────────────────────────────────────────────────────────────────────────
# 钉钉通知模式配置
# ─────────────────────────────────────────────────────────────────────────────
dingtalk:
  mode: enterprise  # enterprise（企业钉钉）或 personal（个人钉钉Webhook）
  # 企业钉钉配置继承application.yml中的ding配置
  # 个人钉钉Webhook配置（如使用personal模式需配置）
  personal-webhook-url: ""

# ─────────────────────────────────────────────────────────────────────────────
# 分类通知配置（定时通知功能）
# ─────────────────────────────────────────────────────────────────────────────
classify-config:
  global:
    # 分类字段：从条目中提取此字段值用于匹配 classify-rules
    classify-field: "severities"           # 可配置：priority、severities、categories 或自定义字段

    # 默认分类规则（按 classify-field 的值匹配）
    classify-rules:
      - category: "严重"                    # 当 severities 包含 "严重" 时匹配
        member-interval-days: 1             # 成员每1天通知
        manager-escalate-days: 2            # 第2天起通知科长
        director-escalate-days: 3           # 第3天起通知部长

      - category: "一般"
        member-interval-days: 2
        manager-escalate-days: 3
        director-escalate-days: 5

      - category: "轻微"
        member-interval-days: 3
        manager-escalate-days: 5
        director-escalate-days: null        # null 表示不通知部长

    # 默认分类（当 classify-field 值不匹配任何规则时使用）
    default-category: "一般"

    # 默认通知时间（每天执行定时通知的时间）
    default-notify-time: "08:00"

  projects:
    "5":
      # 项目级覆盖 classify-field
      classify-field: "priority"
      # 项目级覆盖 classify-rules（完全覆盖全局，不追加）
      classify-rules:
        - category: "高"
          member-interval-days: 1
          manager-escalate-days: 1
          director-escalate-days: 2
        - category: "中"
          member-interval-days: 2
          manager-escalate-days: 3
          director-escalate-days: 5
        - category: "低"
          member-interval-days: 3
          manager-escalate-days: 5
          director-escalate-days: null

# ─────────────────────────────────────────────────────────────────────────────
# Tracker类型映射（决定消息中 {trackertype} 显示内容）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
type-mappings:
  global:
    Requirement: "需求"
    Bug: "缺陷"
    Task: "任务"
  projects:
    "5":
      Requirement: "智驾需求"
      Bug: "智驾缺陷"
# ─────────────────────────────────────────────────────────────────────────────
# 额外字段配置（动态插入到链接行之前）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
extra-fields:
  global:
    - field: "priority"
      label: "优先级"
  projects:
    "5":


# ─────────────────────────────────────────────────────────────────────────────
# 全局工作流模板（无description字段）
# 项目级可直接引用或定义同名覆盖
# ─────────────────────────────────────────────────────────────────────────────
global-workflows:
  - name: "标准Bug工作流"
    states:
      - name: "新建"
        notify: false
      - name: "处理中"
        notify-field: "assignedTo"
      - name: "已解决"
        notify-field: "submitter"
      - name: "已关闭"
        notify: false

# ─────────────────────────────────────────────────────────────────────────────
# 项目级配置
# ─────────────────────────────────────────────────────────────────────────────
projects:
  - project-id: 5
    project-name: "TEST FOR CHUNFENG"

    # 项目级 type-mappings（覆盖全局，已在上方type-mappings.projects中配置）

    # 项目级 extra-fields（覆盖全局，已在上方extra-fields.projects中配置）

    # 项目独有 workflow（复用全局直接在tracker-matching引用）
    workflows:
      - name: "智驾需求流程"
        states:
          - name: "Accepted"
            notify: false
          - name: "Draft"
            notify-field: "assignedTo"
          - name: "Waiting for approval"
            notify-field: "assignedTo"
          - name: "Approved"
            notify-field: "assignedTo"
          - name: "已关闭"
            notify: false

    # tracker-matching：tracker-id + tracker-type（无tracker-name，防止名称重复）
    tracker-matching:
      - tracker-id: 5292
        workflow: "智驾需求流程"
      - tracker-id: 222
        workflow: "标准Bug工作流"
      - tracker-type: "Bug"
        workflow: "标准Bug工作流"
      - tracker-type: "Requirement"
        workflow: "智驾需求流程"

    # trackers：差异部分配置（最高优先级，可定义extra-fields覆盖项目级）
    trackers:
      - tracker-id: 5292
        # tracker级 extra-fields（完全覆盖项目级）
        extra-fields:
          - field: "11111"
            label: "11111"
          - field: "priority"
            label: "优先级"
        # tracker级 notify-time（覆盖全局 default-notify-time）
        notify-time: "09:00"
        # tracker级 classify-field 和 classify-rules（完全覆盖上级）
        classify-field: "客户优先级"        # 自定义字段
        classify-rules:
          - category: "紧急"
            member-interval-days: 1
            manager-escalate-days: 1
            director-escalate-days: 2
        # tracker级状态配置示例
        states:
          - name: "Draft"
            notify-field: "assignedTo"
            scheduled-notify: true           # 开启定时通知（默认 true，可省略）
          - name: "Waiting for approval"
            notify-field: "assignedTo"
            scheduled-notify: false          # 显式关闭定时通知（只即时通知，不定时提醒）

      - tracker-id: 333
        # tracker级 extra-fields 空列表（不显示任何额外字段）
        extra-fields: []
        states:
          - name: "特殊状态A"
            notify-field: "特殊通知人"
          - name: "特殊状态B"
            notify: false

  - project-id: 1002
    project-name: "底盘项目B"

    # 无项目独有workflow，完全复用全局

    tracker-matching:
      - tracker-type: "Bug"
        workflow: "标准Bug工作流"
      - tracker-type: "Requirement"
        workflow: "标准需求工作流"