# 工作流通知配置文件

# 预清理执行时间（凌晨执行数据同步，确保定时通知前数据正确）
default-cleanup-time: "04:00"

# 定时通知执行时间
default-notify-time: "19:40"

# 批量通知轮询时长配置
default-batch-notify-delay: 180000

classify-config:
  # 分类通知配置（定时通知功能）
  projects:
    "5":
      tracker-types:
        "Bug":                                    # Bug 类型启用分类通知
          classify-field: "严重程度"
          classify-rules:
            - category: "A"
              member-interval-days: 1
              manager-escalate-days: 1
              director-escalate-days: 1
            - category: "B"
              member-interval-days: 1
              manager-escalate-days: 3
              director-escalate-days: 5
            - category: "C"
              member-interval-days: 1
              manager-escalate-days: 5
              director-escalate-days: null

# ─────────────────────────────────────────────────────────────────────────────
# Tracker类型映射（决定消息中 {trackertype} 显示内容）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
type-mappings:
  global:
  projects:
    "5":
      Bug: "问题"

# ─────────────────────────────────────────────────────────────────────────────
# 额外字段配置（动态插入到链接行之前）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
extra-fields:
#  global:
#    - field:
#      label:
  projects:
    "5":
      - field: "严重程度"
        label: "严重程度"

# ─────────────────────────────────────────────────────────────────────────────
# 全局工作流模板（无description字段）
# 项目级可直接引用或定义同名覆盖
# ─────────────────────────────────────────────────────────────────────────────
global-workflows:
  - name:
    states:


# ─────────────────────────────────────────────────────────────────────────────
# 项目级工作流配置
# ─────────────────────────────────────────────────────────────────────────────
projects:
  - project-id: 5
    project-name: "TEST FOR CHUNFENG"

    # 项目独有 workflow（复用全局直接在tracker-matching引用）
    workflows:
      - name: "问题工作流"
        states:
          - name: "新建"
            notify-field:
              - "assignedTo"
              - "裁决人"
            scheduled-notify-field: "裁决人"
            scheduled-notify: true
          - name: "重复"
            notify-field: "裁决人"
            scheduled-notify: true
          - name: "处理中"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "无效bug"
            notify: false
            scheduled-notify: true
          - name: "设计如此"
            notify: false
            scheduled-notify: true
          - name: "不予解决"
            notify: false
            scheduled-notify: true
          - name: "申请延后处理"
            notify-field: "supervisors"
            scheduled-notify: true
          - name: "持续跟踪"
            notify-field: "submitter"
            scheduled-notify: true
          - name: "发布"
            notify-field: "发布责任人"
          - name: "裁决"
            notify-field: "裁决人"
            scheduled-notify: true
          - name: "延后处理"
            notify-field: "supervisors"
            scheduled-notify: true
          - name: "验证"
            notify-field: "验证责任人"
            scheduled-notify: true
          - name: "结束"
            notify: false
          - name: "重新开启"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "解决"
            notify: false
    # tracker-matching：tracker-id + tracker-type
    tracker-matching:
      - tracker-type: "Bug"
        workflow: "问题工作流"

  - project-id: 10
    project-name: "春风模拟-EEA2.0-多过程域配置"

    # 项目独有 workflow（复用全局直接在tracker-matching引用）
    workflows:
      - name: "需求工作流"
        states:
          - name: "新建"
            notify: false
          - name: "填写中"
            notify: false
          - name: "评审中"
            notify: false
          - name: "科长批准"
            notify: false
            scheduled-notify-field: "评审科长"
            scheduled-notify: true
            batch-notify-field:
              - "评审科长"
          - name: "部长批准"
            notify: false
            scheduled-notify-field: "评审部长"
            scheduled-notify: true
            batch-notify-field:
              - "评审部长"
          - name: "已拒绝"
            notify: false
            batch-notify-field:
              - "assignedTo"
          - name: "已废弃"
            notify: false
          - name: "已挂起"
            notify: false
          - name: "已发布"
            notify: false
            batch-notify-field:
              - "测试负责人"
              - "下游分配人"
          - name: "修改中"
            notify: false
      - name: "测试工作流"
        states:
          - name: "新建"
            notify: false
          - name: "填写中"
            notify: false
          - name: "评审中"
            notify: false
          - name: "科长批准"
            notify: false
            scheduled-notify-field: "评审科长"
            scheduled-notify: true
            batch-notify-field:
              - "评审科长"
          - name: "部长批准"
            notify: false
            scheduled-notify-field: "评审部长"
            scheduled-notify: true
            batch-notify-field:
              - "评审部长"
          - name: "已拒绝"
            notify: false
            batch-notify-field:
              - "assignedTo"
          - name: "已废弃"
            notify: false
          - name: "已挂起"
            notify: false
          - name: "修改中"
            notify: false
    # tracker-matching：tracker-id + tracker-type
    tracker-matching:
      - tracker-type: "Requirement"
        workflow: "需求工作流"
      - tracker-type: "Test Case"
        workflow: "测试工作流"


