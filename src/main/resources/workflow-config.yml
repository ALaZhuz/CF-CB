# 工作流通知配置文件

dingtalk:
  mode: enterprise
  personal-webhook-url: ""

default-notify-time: "19:40"

classify-config:
  # 分类通知配置（定时通知功能）
  projects:
    "5":
      tracker-types:
        "Bug":                                    # Bug 类型启用分类通知
          classify-field: "priority"
          classify-rules:
            - category: "High"
              member-interval-days: 1
              manager-escalate-days: 1
              director-escalate-days: 1
            - category: "Normal"
              member-interval-days: 1
              manager-escalate-days: 3
              director-escalate-days: 5
            - category: "Low"
              member-interval-days: 1
              manager-escalate-days: 5
              director-escalate-days: null
        # "Requirement": null                    # Requirement 类型不启用分类通知（可省略）
        # "Task":                                 # Task 类型也可配置独立规则
        #   classify-field: "severities"
        #   classify-rules: ...

# ─────────────────────────────────────────────────────────────────────────────
# Tracker类型映射（决定消息中 {trackertype} 显示内容）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
type-mappings:
  global:
    Requirement: "需求"
    Bug: "缺陷"
    Task: "任务"
  projects:
    "5":
      Requirement: "智驾需求"
      Bug: "问题"

# ─────────────────────────────────────────────────────────────────────────────
# 额外字段配置（动态插入到链接行之前）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
extra-fields:
  global:
    - field:
      label:
  projects:
    "5":

# ─────────────────────────────────────────────────────────────────────────────
# 全局工作流模板（无description字段）
# 项目级可直接引用或定义同名覆盖
# ─────────────────────────────────────────────────────────────────────────────
global-workflows:
  - name: "标准Bug工作流"
    states:
      - name: "新建"
        notify: false
      - name: "处理中"
        notify-field: "assignedTo"
      - name: "已解决"
        notify-field: "submitter"
      - name: "已关闭"
        notify: false

# ─────────────────────────────────────────────────────────────────────────────
# 项目级工作流配置
# ─────────────────────────────────────────────────────────────────────────────
projects:
  - project-id: 5
    project-name: "TEST FOR CHUNFENG"

    # 项目独有 workflow（复用全局直接在tracker-matching引用）
    workflows:
      - name: "客户需求流程"
        states:
          - name: "New"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "Draft"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "Waiting for approval"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "Accepted"
            notify-field: false


      - name: "问题工作流"
        states:
          - name: "New"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "Verified"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "In progress"
            notify-field: "Resolved"
            scheduled-notify: true
          - name: "InQA"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "Reopened"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "	Closed"
            notify: false

    # tracker-matching：tracker-id + tracker-type
    tracker-matching:
      - tracker-id: 5292
        workflow: "客户需求流程"
      - tracker-id: 5295
        workflow: "问题工作流"
      - tracker-type: "Bug"
        workflow: "标准Bug工作流"

    # trackers：差异部分配置（最高优先级，可定义extra-fields覆盖项目级）
    trackers:
      - tracker-id: 5295
        # tracker级 extra-fields（完全覆盖项目级）
        extra-fields:
          - field: "priority"
            label: "严重程度"