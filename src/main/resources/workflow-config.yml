# 工作流通知配置文件

dingtalk:
  mode: enterprise
  personal-webhook-url: ""

default-notify-time: "19:40"

classify-config:
  # 分类通知配置（定时通知功能）
  projects:
    "5":
      tracker-types:
        "Bug":                                    # Bug 类型启用分类通知
          classify-field: "严重程度"
          classify-rules:
            - category: "A"
              member-interval-days: 1
              manager-escalate-days: 1
              director-escalate-days: 1
            - category: "B"
              member-interval-days: 1
              manager-escalate-days: 3
              director-escalate-days: 5
            - category: "C"
              member-interval-days: 1
              manager-escalate-days: 5
              director-escalate-days: null

# ─────────────────────────────────────────────────────────────────────────────
# Tracker类型映射（决定消息中 {trackertype} 显示内容）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
type-mappings:
  global:
  projects:
    "5":
      Bug: "问题"

# ─────────────────────────────────────────────────────────────────────────────
# 额外字段配置（动态插入到链接行之前）
# 项目级完全覆盖全局，不追加
# ─────────────────────────────────────────────────────────────────────────────
extra-fields:
  global:
    - field:
      label:
  projects:
    "5":
      - field: "严重程度"
        label: "严重程度"

# ─────────────────────────────────────────────────────────────────────────────
# 全局工作流模板（无description字段）
# 项目级可直接引用或定义同名覆盖
# ─────────────────────────────────────────────────────────────────────────────
global-workflows:
  - name:
    states:


# ─────────────────────────────────────────────────────────────────────────────
# 项目级工作流配置
# ─────────────────────────────────────────────────────────────────────────────
projects:
  - project-id: 5
    project-name: "TEST FOR CHUNFENG"

    # 项目独有 workflow（复用全局直接在tracker-matching引用）
    workflows:
      - name: "问题工作流"
        states:
          - name: "新建"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "重复"
            notify-field: "裁决人"
            scheduled-notify: true
          - name: "处理中"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "无效bug"
            notify-field: ""
            scheduled-notify: true
          - name: "设计如此"
            notify-field: ""
            scheduled-notify: true
          - name: "不予解决"
            notify: false
            scheduled-notify: true
          - name: "申请延后处理"
            notify-field: "supervisors"
            scheduled-notify: true
          - name: "持续跟踪"
            notify-field: "submitter"
            scheduled-notify: true
          - name: "发布"
            notify-field: "发布责任人"
          - name: "裁决"
            notify-field: "裁决人"
            scheduled-notify: true
          - name: "延后处理"
            notify-field: "supervisors"
            scheduled-notify: true
          - name: "验证"
            notify-field: "验证责任人"
            scheduled-notify: true
          - name: "结束"
            notify: false
          - name: "重新开启"
            notify-field: "assignedTo"
            scheduled-notify: true
          - name: "解决"
            notify: false

    # tracker-matching：tracker-id + tracker-type
    tracker-matching:
      - tracker-id: 5292
        workflow: "客户需求流程"
      - tracker-type: "Bug"
        workflow: "标准Bug工作流"

    # trackers：差异部分配置（最高优先级，可定义extra-fields覆盖项目级）
    trackers:
      - tracker-id: 5295
        # tracker级 extra-fields（完全覆盖项目级）
        extra-fields:
          - field: "priority"
            label: "严重程度"